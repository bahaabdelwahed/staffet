name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to read existing version tags

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Require a version bump
        run: |
          V=$(node -p "require('./package.json').version")
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::Version $V is already released. Bump the version in package.json."
            exit 1
          fi

      - run: npm test
