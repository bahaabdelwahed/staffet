# Redaction rules — applied to tool outputs before they reach the model.
# Every match is replaced by the redaction token ([CONFIDENTIAL_NEVER_ASK]).
#
# Fields:  pattern (JS regex)  flags (default "g")  group (capture group to replace, default whole match)
#          validator (ipv4 | luhn | iban | secret-token | secret-value)   allow (regexes; a matching value is kept)
#          keywords (cheap pre-filter: rule only runs when one of these substrings is present, case-insensitive)
version: 1
rules:
  # ───────────────────────────── secrets ─────────────────────────────
  - id: redact.private-key
    type: redact
    name: Private key blocks
    category: secret
    severity: critical
    pattern: '-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY(?: BLOCK)?-----[\s\S]*?-----END (?:[A-Z0-9 ]+ )?PRIVATE KEY(?: BLOCK)?-----'
    keywords: ['PRIVATE KEY']

  - id: redact.aws-access-key
    type: redact
    name: AWS access key id
    category: secret
    severity: critical
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    keywords: [AKIA, ASIA]

  - id: redact.aws-secret-key
    type: redact
    name: AWS secret access key
    category: secret
    severity: critical
    pattern: 'aws[\w\s-]{0,24}?(?:secret|sk)[\w\s-]{0,24}?[''"=:\s]+([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
    flags: gi
    group: 1
    keywords: [aws]

  - id: redact.github-token
    type: redact
    name: GitHub token
    category: secret
    severity: critical
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255})\b'
    keywords: [ghp_, gho_, ghu_, ghs_, ghr_, github_pat_]

  - id: redact.gitlab-token
    type: redact
    name: GitLab token
    category: secret
    severity: critical
    pattern: '\bgl(?:pat|dt|rt|cbt|ptt|ft|soat)-[A-Za-z0-9_-]{20,}'
    keywords: [glpat-, gldt-, glrt-, glcbt-, glptt-, glft-, glsoat-]

  - id: redact.slack-token
    type: redact
    name: Slack token / webhook
    category: secret
    severity: critical
    pattern: '\bxox[abeoprs]-[A-Za-z0-9-]{10,}|https://hooks\.slack\.com/(?:services|workflows)/[A-Za-z0-9/_-]+'
    keywords: [xox, hooks.slack.com]

  - id: redact.llm-api-key
    type: redact
    name: LLM provider API key (OpenAI, Anthropic, OpenRouter ...)
    category: secret
    severity: critical
    pattern: '\bsk-(?:ant-|proj-|svcacct-|admin-|or-v1-)?[A-Za-z0-9_-]{20,}'
    validator: secret-token
    keywords: [sk-]

  - id: redact.google-api-key
    type: redact
    name: Google API key
    category: secret
    severity: critical
    pattern: '\bAIza[0-9A-Za-z_-]{35}'
    keywords: [AIza]

  - id: redact.stripe-key
    type: redact
    name: Stripe key
    category: secret
    severity: critical
    pattern: '\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}'
    keywords: [sk_live_, sk_test_, rk_live_, rk_test_]

  - id: redact.package-registry-token
    type: redact
    name: npm / PyPI token
    category: secret
    severity: critical
    pattern: '\bnpm_[A-Za-z0-9]{36}\b|\bpypi-[A-Za-z0-9_-]{50,}'
    keywords: [npm_, pypi-]

  - id: redact.azure-connection-secret
    type: redact
    name: Azure storage / service-bus key
    category: secret
    severity: critical
    pattern: '\b(AccountKey|SharedAccessKey|SharedAccessSignature)=([A-Za-z0-9+/=%&-]{20,})'
    group: 2
    keywords: [AccountKey=, SharedAccessKey=, SharedAccessSignature=]

  - id: redact.jwt
    type: redact
    name: JSON Web Token
    category: secret
    severity: high
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
    keywords: [eyJ]

  - id: redact.auth-header
    type: redact
    name: Authorization / API-key header value
    category: secret
    severity: critical
    pattern: '\b((?:authorization|x-api-key|api-key|x-auth-token|proxy-authorization)["'']?\s*[:=]\s*["'']?(?:(?:bearer|basic|token)\s+)?)([A-Za-z0-9._~+/=-]{12,})'
    flags: gi
    group: 2
    keywords: [authorization, api-key, x-auth-token]

  - id: redact.url-credentials
    type: redact
    name: Password embedded in a URL
    category: secret
    severity: critical
    pattern: '\b([a-z][a-z0-9+.-]{1,15}://[^\s:/@''"]{1,64}:)([^\s@/''"]{3,})(?=@)'
    flags: gi
    group: 2
    allow: ['^(?:password|passwd|pass|pwd|secret|\*+|x+|<[^>]*>|\$\{?\w+\}?|%\w+%|\{\{?\w+\}?\})$']
    keywords: ['://']

  - id: redact.secret-assignment-quoted
    type: redact
    name: Quoted secret assigned to a password/token/key name
    category: secret
    severity: high
    pattern: '\b((?:[A-Za-z0-9_.-]*?)(?:password|passwd|pwd|secret|api[_-]?key|apikey|access[_-]?key|auth[_-]?token|private[_-]?key|client[_-]?secret|credentials?|token)["'']?\s*[:=]\s*)(["''])([^"''\s]{6,})\2'
    flags: gi
    group: 3
    allow:
      - '^(?:string|number|boolean|object|array|null|undefined|true|false|none|required|optional|password|passwd|secret|changeme|change-me|example|placeholder|redacted|hidden|bearer|basic)$'
      - '^(?:your|my|some|test|dummy|fake|sample|example)[-_ ]'
      - '^(?:x{3,}|\*{3,}|\.{3,}|<[^>]*>|\$\{[^}]*\}|\$\w+|%\w+%|\{\{[^}]*\}\}|process\.env\..*|os\.environ.*|env\(.*|ENV\[.*)$'
    keywords: [password, passwd, pwd, secret, key, token, credential]

  - id: redact.secret-assignment-env
    type: redact
    name: Secret in a KEY=value line (.env, shell exports)
    category: secret
    severity: high
    # "PWD" alone is the shell's working directory, so it only counts with a prefix (DB_PWD)
    pattern: '^(\s*(?:export\s+|set\s+|\$env:)?(?:[A-Za-z0-9_]*(?:PASSWORD|PASSWD|SECRET|API_?KEY|ACCESS_?KEY|AUTH_?TOKEN|PRIVATE_?KEY|CLIENT_?SECRET|TOKEN|CREDENTIALS?)|[A-Za-z0-9_]+_PWD)(?:_BASE|_VALUE|_ID)?\s*=\s*)([^\s''"#$<{][^\s#]{5,})\s*$'
    flags: gm
    group: 2
    allow: ['^(?:changeme|change-me|password|secret|example|placeholder|redacted|true|false|null|none)$', '^(?:your|my|some|test|dummy|fake|sample|example)[-_]']
    keywords: [PASSWORD, PASSWD, PWD, SECRET, KEY, TOKEN, CREDENTIAL]

  - id: redact.secret-assignment-inline
    type: redact
    name: Secret passed inline (command lines, query strings)
    description: 'PGPASSWORD=… psql, --password=…, ?token=… — only values that look machine-made (letters and digits) so code like api_key=settings.key is left alone.'
    category: secret
    severity: high
    pattern: '(?<![\w.])((?:[A-Za-z0-9_-]*(?:PASSWORD|PASSWD|SECRET|API_?KEY|ACCESS_?KEY|AUTH_?TOKEN|CLIENT_?SECRET|TOKEN)|[A-Za-z0-9_]+_PWD)=)([^\s''"&;|<>$#{}()\[\],]{8,})'
    flags: gi
    group: 2
    validator: secret-inline
    keywords: [password, passwd, pwd, secret, key, token]

  - id: redact.secret-assignment-yaml
    type: redact
    name: Secret in a "name:" value line (YAML, properties)
    category: secret
    severity: high
    pattern: '^(\s*-?\s*[\w.-]*(?:password|passwd|secret|api[_-]?key|access[_-]?key|auth[_-]?token|client[_-]?secret|token)\s*:\s+)([^\s''"#$<{\[|>&*!][^\s#]{5,})\s*$'
    flags: gim
    group: 2
    validator: secret-value
    keywords: [password, passwd, secret, key, token]

  # ───────────────────────────── personal data ─────────────────────────────
  - id: redact.email
    type: redact
    name: Email addresses
    category: pii
    severity: high
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,24}\b'
    allow:
      - '^git@'
      - '@(?:example\.(?:com|org|net)|users\.noreply\.github\.com|localhost)$'
      - '^(?:noreply|no-reply)@(?:github\.com|anthropic\.com|google\.com)$'
      - '@[0-9]x\.'
    keywords: ['@']

  - id: redact.credit-card
    type: redact
    name: Payment card numbers
    category: pii
    severity: critical
    pattern: '\b(?:\d[ -]?){12,18}\d\b'
    validator: luhn

  - id: redact.iban
    type: redact
    name: IBAN bank account numbers
    category: pii
    severity: high
    pattern: '\b[A-Z]{2}\d{2}[ ]?(?:[A-Z0-9]{4}[ ]?){2,7}[A-Z0-9]{1,4}\b'
    validator: iban

  - id: redact.us-ssn
    type: redact
    name: US social security numbers
    category: pii
    severity: high
    pattern: '\b(?!000|666|9\d\d)\d{3}-(?!00)\d{2}-(?!0000)\d{4}\b'

  - id: redact.phone-international
    type: redact
    name: Phone numbers (international format)
    category: pii
    severity: medium
    enabled: false
    pattern: '(?<![\w.+-])\+\d{1,3}[ .-]?\(?\d{1,4}\)?(?:[ .-]?\d{2,4}){2,4}(?![\w-])'
    keywords: ['+']

  # ───────────────────────────── network ─────────────────────────────
  - id: redact.ipv4
    type: redact
    name: IPv4 addresses
    category: network
    severity: high
    pattern: '(?<![\w.])(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?![\w]|\.\d)'
    validator: ipv4
    allow: ['^(?:8\.8\.8\.8|8\.8\.4\.4|1\.1\.1\.1|1\.0\.0\.1)$']

  - id: redact.ipv6
    type: redact
    name: IPv6 addresses
    category: network
    severity: high
    pattern: '(?<![\w:.])(?:(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}|(?:[0-9A-Fa-f]{1,4}:){2,7}:)(?![\w:.])'
    validator: ipv6
    keywords: [':']

  - id: redact.mac-address
    type: redact
    name: MAC addresses
    category: network
    severity: medium
    pattern: '\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b'

  - id: redact.internal-hostname
    type: redact
    name: Internal hostnames (.corp / .internal / .intranet / .lan)
    description: Generic suffixes are noisy in source code, so this is off by default. Prefer enterprise.internalDomains in the config.
    category: network
    severity: medium
    enabled: false
    pattern: '\b(?:[a-z0-9-]+\.)+(?:corp|internal|intranet|lan)\b(?![\w-]|\.\w)'
    flags: gi
