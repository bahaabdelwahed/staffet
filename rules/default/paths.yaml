# Path rules — files and folders no tool call (file tool or shell command) may touch.
#
# Fields:  action (block | warn)   paths (globs: ** any depth, * one segment; "~" = any user's home;
#          unanchored patterns match at any depth; a folder also covers everything below it)
#          operations (any | read | write)   except (globs that are still allowed)
# Add your own protected folders with:  staffet protect "D:/Finance"   (or policy.toolCalls.paths.protected)
version: 1
rules:
  - id: path.ssh-keys
    type: path
    name: SSH keys and configuration
    severity: critical
    action: block
    paths: ["~/.ssh", "**/id_rsa", "**/id_dsa", "**/id_ecdsa", "**/id_ed25519", "**/*.ppk", "/etc/ssh/ssh_host_*"]
    except: ["**/*.pub", "~/.ssh/known_hosts"]

  - id: path.cloud-credentials
    type: path
    name: Cloud and cluster credentials
    severity: critical
    action: block
    paths: ["~/.aws", "~/.azure", "~/.config/gcloud", "~/.kube", "~/.docker/config.json", "~/.oci", "~/.terraform.d/credentials.tfrc.json", "**/*.tfstate", "**/*.tfstate.backup", "**/terraform.tfvars", "**/kubeconfig", "**/service-account*.json", "**/gcp-key*.json"]

  - id: path.credential-stores
    type: path
    name: Credential stores and token files
    severity: critical
    action: block
    paths: ["~/.netrc", "~/_netrc", "~/.git-credentials", "~/.npmrc", "~/.pypirc", "~/.gnupg", "~/.password-store", "~/.config/gh/hosts.yml", "~/.m2/settings.xml", "~/.gradle/gradle.properties", "**/*.kdbx", "**/*.kdb", "**/*.keychain", "**/*.keychain-db", "**/*.jks", "**/*.keystore", "**/*.pfx", "**/*.p12", "**/credentials.json", "**/secrets.json", "**/secrets.yaml", "**/secrets.yml", "**/.htpasswd"]

  - id: path.private-keys
    type: path
    name: Private key and certificate key files
    severity: critical
    action: block
    paths: ["**/*.pem", "**/*.key", "**/*.asc"]
    except: ["**/*.pub.pem", "**/public*.pem", "**/cert*.pem", "**/ca*.pem", "**/*.crt.pem", "**/fullchain*.pem", "**/chain*.pem"]

  - id: path.env-files
    type: path
    name: Environment files with secrets
    severity: high
    action: block
    paths: ["**/.env", "**/.env.*", "**/*.env"]
    except: ["**/.env.example", "**/.env.sample", "**/.env.template", "**/.env.dist", "**/.env.defaults", "**/example.env", "**/sample.env"]

  - id: path.system-secrets
    type: path
    name: Operating-system account and secret databases
    severity: critical
    action: block
    paths: ["/etc/shadow", "/etc/gshadow", "/etc/sudoers", "/etc/sudoers.d", "/etc/master.passwd", "/etc/krb5.keytab", "/root", "/var/lib/sss", "c:/windows/system32/config", "c:/windows/ntds", "c:/windows/repair", "**/ntds.dit", "/proc/*/environ", "/proc/kcore", "/dev/mem"]

  - id: path.browser-and-os-vaults
    type: path
    name: Browser profiles and OS credential vaults
    severity: critical
    action: block
    paths: ["**/login data", "**/cookies.sqlite", "**/logins.json", "**/key4.db", "**/google/chrome/user data", "**/microsoft/edge/user data", "**/mozilla/firefox/profiles", "~/appdata/roaming/microsoft/credentials", "~/appdata/local/microsoft/credentials", "~/appdata/roaming/microsoft/protect", "~/appdata/local/microsoft/vault", "~/library/keychains", "~/library/cookies", "~/.local/share/keyrings"]

  - id: path.shell-history
    type: path
    name: Shell history
    severity: medium
    action: block
    paths: ["~/.bash_history", "~/.zsh_history", "~/.python_history", "~/.mysql_history", "~/.psql_history", "**/consolehost_history.txt"]

  - id: path.system-write
    type: path
    name: Writing to system locations
    severity: high
    action: block
    operations: [write]
    paths: ["/etc", "/boot", "/usr/bin", "/usr/sbin", "/bin", "/sbin", "/lib", "/lib64", "c:/windows", "c:/program files", "c:/program files (x86)", "~/.bashrc", "~/.zshrc", "~/.profile", "~/.bash_profile", "~/.config/autostart", "**/start menu/programs/startup", "/etc/cron*", "/var/spool/cron", "~/library/launchagents", "/library/launchdaemons"]

  - id: path.hosts-file
    type: path
    name: Hosts file
    severity: medium
    action: warn
    paths: ["/etc/hosts", "c:/windows/system32/drivers/etc/hosts"]

  - id: path.passwd
    type: path
    name: Account list
    severity: low
    action: warn
    paths: ["/etc/passwd", "/etc/group"]
