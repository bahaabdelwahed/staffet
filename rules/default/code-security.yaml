# Built-in (in-process, millisecond) security rules for code the model produces.
# They run on every response; Semgrep / Opengrep rules in rules/semgrep add deeper, syntax-aware checks.
#
# Fields:  languages (python, javascript, typescript, java, go, c, cpp, csharp, php, ruby, shell, powershell, or "*")
#          pattern (JS regex, flags default "g")   severity (error | warning | info)   cwe   fix (hint sent to the model)
#          exclude (regex; a match on the same line suppresses the finding)   matchComments (default false)
version: 1
rules:
  # ───────────── any language ─────────────
  - id: code.generic.hardcoded-secret
    type: code
    name: Hard-coded credential
    languages: ['*']
    severity: error
    cwe: CWE-798
    pattern: '(?:password|passwd|pwd|secret|api[_-]?key|apikey|access[_-]?key|auth[_-]?token|private[_-]?key|client[_-]?secret)\w*["'']?\s*[:=]\s*["''][^"''\s${}<>]{8,}["'']'
    flags: gi
    exclude: '(?:example|placeholder|changeme|change-me|your[_-]|xxxx|dummy|<[^>]+>|getenv|process\.env|os\.environ|environ\[|config\.|settings\.|\$\{|%\(|\{\{)'
    message: A credential is hard-coded in source code.
    fix: Read the value from an environment variable or a secret manager instead of embedding it.

  - id: code.generic.private-key
    type: code
    name: Private key embedded in code
    languages: ['*']
    severity: error
    cwe: CWE-321
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY'
    matchComments: true
    message: A private key is embedded in the code.
    fix: Load keys from a secure store or a file excluded from version control.

  - id: code.generic.cloud-key
    type: code
    name: Cloud access key embedded in code
    languages: ['*']
    severity: error
    cwe: CWE-798
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b|\bAIza[0-9A-Za-z_-]{35}\b|\bgh[pousr]_[A-Za-z0-9]{36,}\b|\bsk_live_[A-Za-z0-9]{16,}\b'
    matchComments: true
    message: A live cloud/API access key is embedded in the code.
    fix: Remove the key, rotate it, and load it from the environment.

  # ───────────── Python ─────────────
  - id: code.py.eval-exec
    type: code
    name: eval / exec
    languages: [python]
    severity: error
    cwe: CWE-95
    pattern: '(?<![\w.])(?:eval|exec)\s*\((?!\s*["''][^"'']*["'']\s*\))'
    message: eval()/exec() runs arbitrary code.
    fix: Use ast.literal_eval for data, or an explicit dispatch table instead of dynamic code.

  - id: code.py.subprocess-shell
    type: code
    name: subprocess with shell=True
    languages: [python]
    severity: error
    cwe: CWE-78
    pattern: '\bsubprocess\.\w+\s*\([^)]*\bshell\s*=\s*True'
    message: subprocess is called with shell=True, which allows shell command injection.
    fix: Pass an argument list (e.g. subprocess.run(["ls", path])) and drop shell=True.

  - id: code.py.os-system
    type: code
    name: os.system / os.popen
    languages: [python]
    severity: warning
    cwe: CWE-78
    pattern: '\bos\.(?:system|popen)\s*\('
    message: os.system()/os.popen() run a shell command line.
    fix: Use subprocess.run([...]) with an argument list.

  - id: code.py.sql-injection
    type: code
    name: SQL built with string formatting
    languages: [python]
    severity: error
    cwe: CWE-89
    pattern: '\.execute(?:many|script)?\s*\(\s*(?:f["'']|["''][^"''\n]*["'']\s*(?:%|\+|\.format\s*\())'
    message: A SQL statement is built with string formatting or concatenation.
    fix: 'Use bound parameters: cursor.execute("SELECT ... WHERE id = %s", (value,)).'

  - id: code.py.unsafe-deserialization
    type: code
    name: Unsafe deserialization
    languages: [python]
    severity: warning
    cwe: CWE-502
    pattern: '\b(?:pickle|cPickle|dill|marshal|shelve)\.loads?\s*\(|\byaml\.unsafe_load\s*\(|\byaml\.load\s*\((?![^)]*Loader\s*=\s*(?:yaml\.)?(?:Safe|CSafe)Loader)[^)]*\)'
    message: Deserializing untrusted data with pickle / yaml.load can execute arbitrary code.
    fix: Use json, or yaml.safe_load.

  - id: code.py.tls-verify-disabled
    type: code
    name: TLS certificate verification disabled
    languages: [python]
    severity: error
    cwe: CWE-295
    pattern: '\bverify\s*=\s*False\b|ssl\._create_unverified_context|CERT_NONE\b|check_hostname\s*=\s*False'
    message: TLS certificate verification is disabled.
    fix: Remove verify=False; if a private CA is used, pass its bundle via verify="path/to/ca.pem".

  - id: code.py.weak-hash
    type: code
    name: Weak hash algorithm
    languages: [python]
    severity: warning
    cwe: CWE-327
    pattern: '\bhashlib\.(?:md5|sha1)\s*\(|hashlib\.new\s*\(\s*["''](?:md5|sha1)["'']'
    message: MD5/SHA-1 are broken for security purposes.
    fix: Use hashlib.sha256 (or bcrypt/argon2 for passwords).

  - id: code.py.debug-enabled
    type: code
    name: Debug mode enabled
    languages: [python]
    severity: warning
    cwe: CWE-489
    pattern: '\.run\s*\([^)]*\bdebug\s*=\s*True|^\s*DEBUG\s*=\s*True\b'
    flags: gm
    message: Debug mode is enabled; it exposes an interactive debugger / verbose errors in production.
    fix: Drive debug from configuration and default it to False.

  - id: code.py.jwt-no-verify
    type: code
    name: JWT signature verification disabled
    languages: [python]
    severity: error
    cwe: CWE-347
    pattern: '["'']verify_signature["'']\s*:\s*False|\bverify\s*=\s*False[^)\n]*\balgorithms?\b|algorithms\s*=\s*\[\s*["'']none["'']'
    message: JWT signature verification is disabled.
    fix: Always verify the signature with an explicit algorithm list.

  - id: code.py.insecure-tempfile
    type: code
    name: tempfile.mktemp
    languages: [python]
    severity: warning
    cwe: CWE-377
    pattern: '\btempfile\.mktemp\s*\('
    message: tempfile.mktemp() is race-prone.
    fix: Use tempfile.mkstemp() or NamedTemporaryFile().

  # ───────────── JavaScript / TypeScript ─────────────
  - id: code.js.eval
    type: code
    name: eval / new Function
    languages: [javascript, typescript]
    severity: error
    cwe: CWE-95
    pattern: '(?<![\w.$])eval\s*\((?!\s*["''`][^"''`]*["''`]\s*\))|\bnew\s+Function\s*\('
    message: eval()/new Function() execute arbitrary code.
    fix: Parse data with JSON.parse, or use an explicit lookup instead of dynamic code.

  - id: code.js.command-injection
    type: code
    name: Shell command built from variables
    languages: [javascript, typescript]
    severity: error
    cwe: CWE-78
    pattern: '(?:(?<![\w.$])|child_process\.|\bcp\.)(?:exec|execSync)\s*\(\s*(?:`[^`]*\$\{|["''][^"''\n]*["'']\s*\+|[A-Za-z_$][\w$.]*\s*\+)'
    message: A shell command line is assembled from variables and passed to exec().
    fix: Use execFile()/spawn() with an argument array and no shell.

  - id: code.js.sql-injection
    type: code
    name: SQL built with string interpolation
    languages: [javascript, typescript]
    severity: error
    cwe: CWE-89
    pattern: '\.(?:query|execute|raw|run|all|get)\s*\(\s*(?:`[^`]*\b(?:SELECT|INSERT|UPDATE|DELETE|WHERE)\b[^`]*\$\{|["''][^"''\n]*\b(?:SELECT|INSERT|UPDATE|DELETE|WHERE)\b[^"''\n]*["'']\s*\+)'
    flags: gi
    message: A SQL statement is built with string interpolation or concatenation.
    fix: 'Use placeholders: db.query("SELECT ... WHERE id = ?", [id]).'

  - id: code.js.dom-xss
    type: code
    name: Untrusted HTML written to the DOM
    languages: [javascript, typescript]
    severity: warning
    cwe: CWE-79
    pattern: '\.(?:innerHTML|outerHTML)\s*\+?=\s*(?!["''`][^"''`$+]*["''`]\s*;?\s*$)|\bdocument\.write(?:ln)?\s*\(|\.insertAdjacentHTML\s*\(|dangerouslySetInnerHTML'
    flags: gm
    message: HTML is written to the DOM from a non-constant value (XSS risk).
    fix: Use textContent / createElement, or sanitise with a vetted library before inserting HTML.

  - id: code.js.tls-verify-disabled
    type: code
    name: TLS certificate verification disabled
    languages: [javascript, typescript]
    severity: error
    cwe: CWE-295
    pattern: 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED["'']?\s*\]?\s*[=:]\s*["'']?0'
    message: TLS certificate verification is disabled.
    fix: Remove rejectUnauthorized:false; add your CA with the `ca` option or NODE_EXTRA_CA_CERTS.

  - id: code.js.weak-crypto
    type: code
    name: Weak hash / insecure randomness for secrets
    languages: [javascript, typescript]
    severity: warning
    cwe: CWE-327
    pattern: 'createHash\s*\(\s*["''`](?:md5|sha1)["''`]|(?:token|secret|password|otp|nonce|salt|session\w*|apiKey)\w*\s*[:=][^;\n]*Math\.random\s*\('
    flags: gi
    message: Weak hash (MD5/SHA-1) or Math.random() used for a security value.
    fix: Use sha256+ and crypto.randomBytes()/crypto.randomUUID().

  - id: code.js.jwt-none
    type: code
    name: JWT "none" algorithm / unverified decode
    languages: [javascript, typescript]
    severity: error
    cwe: CWE-347
    pattern: 'algorithms?\s*:\s*\[?\s*["''`]none["''`]|ignoreExpiration\s*:\s*true'
    flags: gi
    message: JWT verification is weakened.
    fix: Verify with an explicit strong algorithm list and keep expiry checks on.

  # ───────────── Java ─────────────
  - id: code.java.sql-injection
    type: code
    name: SQL built by concatenation
    languages: [java]
    severity: error
    cwe: CWE-89
    pattern: '(?:executeQuery|executeUpdate|execute|prepareStatement|createQuery|createNativeQuery|addBatch)\s*\(\s*"[^"\n]*"\s*\+'
    message: A SQL statement is built by string concatenation.
    fix: Use PreparedStatement with ? placeholders and setString/setInt.

  - id: code.java.command-exec
    type: code
    name: Runtime.exec with a command line
    languages: [java]
    severity: warning
    cwe: CWE-78
    pattern: 'Runtime\.getRuntime\(\)\.exec\s*\('
    message: Runtime.exec() runs an OS command.
    fix: Use ProcessBuilder with a fixed argument list and validate every argument.

  - id: code.java.weak-crypto
    type: code
    name: Weak cryptography
    languages: [java]
    severity: warning
    cwe: CWE-327
    pattern: 'MessageDigest\.getInstance\s*\(\s*"(?:MD5|SHA-?1)"|Cipher\.getInstance\s*\(\s*"(?:DES|DESede|RC4|Blowfish|AES|[^"]*/ECB/[^"]*)"\s*\)'
    message: Weak digest or cipher mode (MD5, SHA-1, DES, ECB).
    fix: Use SHA-256 and AES/GCM/NoPadding.

  - id: code.java.trust-all-certs
    type: code
    name: TLS validation disabled
    languages: [java]
    severity: error
    cwe: CWE-295
    pattern: 'ALLOW_ALL_HOSTNAME_VERIFIER|NoopHostnameVerifier|checkServerTrusted\s*\([^)]*\)\s*(?:throws\s+[\w.,\s]+)?\{\s*\}|TrustAllStrategy|setHostnameVerifier\s*\(\s*\([^)]*\)\s*->\s*true'
    message: TLS certificate or hostname validation is disabled.
    fix: Use the default trust manager, or a truststore containing your CA.

  - id: code.java.unsafe-deserialization
    type: code
    name: Java native deserialization
    languages: [java]
    severity: warning
    cwe: CWE-502
    pattern: 'new\s+ObjectInputStream\s*\(|\.readObject\s*\(\s*\)|XMLDecoder\s*\('
    message: Native deserialization of untrusted data can lead to remote code execution.
    fix: Use a data-only format (JSON) or an ObjectInputFilter allow-list.

  # ───────────── Go ─────────────
  - id: code.go.tls-skip-verify
    type: code
    name: InsecureSkipVerify
    languages: [go]
    severity: error
    cwe: CWE-295
    pattern: 'InsecureSkipVerify\s*:\s*true'
    message: TLS certificate verification is disabled.
    fix: Remove InsecureSkipVerify; add your CA to tls.Config.RootCAs.

  - id: code.go.sql-injection
    type: code
    name: SQL built with Sprintf / concatenation
    languages: [go]
    severity: error
    cwe: CWE-89
    pattern: '\.(?:Query|QueryRow|Exec|Prepare)(?:Context)?\s*\([^)\n]*(?:fmt\.Sprintf\s*\(|"\s*\+)'
    message: A SQL statement is built with fmt.Sprintf or concatenation.
    fix: 'Use placeholders: db.Query("SELECT ... WHERE id = $1", id).'

  - id: code.go.shell-exec
    type: code
    name: Command run through a shell
    languages: [go]
    severity: warning
    cwe: CWE-78
    pattern: 'exec\.Command(?:Context)?\s*\([^)\n]*"(?:sh|bash|cmd|cmd\.exe|powershell)"\s*,\s*"(?:-c|/c|/C|-Command)"'
    message: A command line is executed through a shell.
    fix: Call the program directly with separate arguments.

  - id: code.go.weak-hash
    type: code
    name: Weak hash algorithm
    languages: [go]
    severity: warning
    cwe: CWE-327
    pattern: '\b(?:md5|sha1)\.(?:New|Sum)\w*\s*\('
    message: MD5/SHA-1 are broken for security purposes.
    fix: Use crypto/sha256.

  # ───────────── C / C++ ─────────────
  - id: code.c.unbounded-copy
    type: code
    name: Unbounded string function
    languages: [c, cpp]
    severity: error
    cwe: CWE-120
    pattern: '(?<![\w.>])(?:strcpy|strcat|sprintf|vsprintf|gets|stpcpy|wcscpy|wcscat)\s*\('
    message: Unbounded string function (strcpy/strcat/sprintf/gets) can overflow the destination buffer.
    fix: Use snprintf / strlcpy / fgets with the destination size and check the result.

  - id: code.c.scanf-unbounded
    type: code
    name: scanf %s without a width
    languages: [c, cpp]
    severity: warning
    cwe: CWE-120
    pattern: '(?<![\w.>])(?:scanf|sscanf|fscanf)\s*\([^)\n]*%s'
    message: scanf("%s") reads without a length limit.
    fix: 'Give a field width: scanf("%63s", buf) for a 64-byte buffer.'

  - id: code.c.command-exec
    type: code
    name: system / popen
    languages: [c, cpp]
    severity: warning
    cwe: CWE-78
    pattern: '(?<![\w.>:])(?:system|popen)\s*\('
    message: system()/popen() run a shell command line.
    fix: Use execve()/posix_spawn() with an argument vector, or a library API.

  - id: code.c.format-string
    type: code
    name: Non-constant format string
    languages: [c, cpp]
    severity: error
    cwe: CWE-134
    pattern: '(?<![\w.>])(?:printf|vprintf)\s*\(\s*[A-Za-z_][\w\[\].>-]*\s*\)|(?<![\w.>])(?:fprintf|syslog|snprintf)\s*\((?:[^,()\n]+,){1,2}\s*[A-Za-z_][\w\[\].>-]*\s*\)'
    message: A variable is used as the format string.
    fix: 'Use a constant format: printf("%s", value).'

  # ───────────── C# ─────────────
  - id: code.cs.sql-injection
    type: code
    name: SQL built by concatenation / interpolation
    languages: [csharp]
    severity: error
    cwe: CWE-89
    pattern: '(?:new\s+(?:Sql|MySql|Npgsql|Oracle|OleDb|Sqlite)Command\s*\(|\.CommandText\s*=|ExecuteSqlRaw\s*\(|FromSqlRaw\s*\()\s*(?:\$@?"|@?\$"|"[^"\n]*"\s*\+)'
    message: A SQL statement is built by concatenation or interpolation.
    fix: Use parameters (cmd.Parameters.AddWithValue) or FromSqlInterpolated.

  - id: code.cs.insecure-deserialization
    type: code
    name: BinaryFormatter / unsafe type handling
    languages: [csharp]
    severity: error
    cwe: CWE-502
    pattern: 'new\s+(?:BinaryFormatter|NetDataContractSerializer|LosFormatter|SoapFormatter)\s*\(|TypeNameHandling\s*=\s*TypeNameHandling\.(?:All|Auto|Objects)'
    message: Insecure deserializer that can instantiate arbitrary types.
    fix: Use System.Text.Json with known types.

  - id: code.cs.tls-validation-disabled
    type: code
    name: Certificate validation disabled
    languages: [csharp]
    severity: error
    cwe: CWE-295
    pattern: 'ServerCertificate(?:Custom)?ValidationCallback\s*\+?=\s*(?:\([^)]*\)|delegate[^{]*)\s*(?:=>\s*true|\{\s*return\s+true)|DangerousAcceptAnyServerCertificateValidator'
    message: TLS certificate validation is disabled.
    fix: Remove the callback and trust your CA through the certificate store.

  - id: code.cs.weak-hash
    type: code
    name: Weak hash algorithm
    languages: [csharp]
    severity: warning
    cwe: CWE-327
    pattern: '\b(?:MD5|SHA1)(?:CryptoServiceProvider|Managed)?\.Create\s*\(|new\s+(?:MD5|SHA1)CryptoServiceProvider\s*\('
    message: MD5/SHA-1 are broken for security purposes.
    fix: Use SHA256.Create().

  # ───────────── PHP ─────────────
  - id: code.php.injection
    type: code
    name: Request data used in SQL / commands / includes
    languages: [php]
    severity: error
    cwe: CWE-74
    pattern: '(?:mysqli?_query|->query|->exec|(?<![\w>])(?:system|exec|shell_exec|passthru|popen|proc_open|eval|assert|include|include_once|require|require_once))\s*\(?[^;\n]*\$_(?:GET|POST|REQUEST|COOKIE|SERVER)\b'
    message: Request data flows straight into a SQL query, shell command, eval or include.
    fix: Use prepared statements, escapeshellarg(), and allow-lists for includes.

  - id: code.php.unserialize
    type: code
    name: unserialize on variable data
    languages: [php]
    severity: warning
    cwe: CWE-502
    pattern: '(?<![\w>])unserialize\s*\(\s*\$'
    message: unserialize() on untrusted data enables object injection.
    fix: Use json_decode(), or pass ['allowed_classes' => false].

  - id: code.php.xss
    type: code
    name: Request data echoed without escaping
    languages: [php]
    severity: warning
    cwe: CWE-79
    pattern: '\b(?:echo|print)\b[^;\n]*\$_(?:GET|POST|REQUEST|COOKIE)\b'
    exclude: 'htmlspecialchars|htmlentities|strip_tags|intval|\(int\)'
    message: Request data is echoed without HTML escaping.
    fix: Wrap output in htmlspecialchars($value, ENT_QUOTES, 'UTF-8').

  # ───────────── Ruby ─────────────
  - id: code.rb.injection
    type: code
    name: Interpolation into SQL / shell / eval
    languages: [ruby]
    severity: error
    cwe: CWE-74
    pattern: '\.(?:where|find_by_sql|execute|order|select|joins)\s*\(?\s*"[^"\n]*#\{|(?<![\w.])(?:system|exec|eval|instance_eval|class_eval)\s*\(?\s*"[^"\n]*#\{|`[^`\n]*#\{[^`\n]*`|%x\([^)\n]*#\{'
    message: A value is interpolated into SQL, a shell command or eval.
    fix: Use bound parameters (where("name = ?", name)) and system("cmd", arg1, arg2).

  - id: code.rb.unsafe-deserialization
    type: code
    name: Unsafe deserialization
    languages: [ruby]
    severity: warning
    cwe: CWE-502
    pattern: '\b(?:Marshal\.load|YAML\.load|Oj\.load)\s*\('
    message: Marshal.load / YAML.load can instantiate arbitrary objects.
    fix: Use YAML.safe_load or JSON.parse.

  # ───────────── Shell / PowerShell ─────────────
  - id: code.sh.remote-pipe-shell
    type: code
    name: Download piped into a shell
    languages: [shell]
    severity: error
    cwe: CWE-494
    pattern: '(?:curl|wget)\b[^|\n]*\|\s*(?:sudo\s+)?(?:ba|z|k|da)?sh\b|\b(?:ba|z)?sh\s+<\(\s*(?:curl|wget)\b'
    message: A script is downloaded and executed without integrity verification.
    fix: Download to a file, verify its checksum/signature, then execute it.

  - id: code.sh.tls-insecure
    type: code
    name: TLS verification disabled
    languages: [shell]
    severity: warning
    cwe: CWE-295
    pattern: '\bcurl\b[^\n]*\s(?:-[a-zA-Z]*k[a-zA-Z]*|--insecure)(?=\s|$)|\bwget\b[^\n]*--no-check-certificate|GIT_SSL_NO_VERIFY=(?:1|true)|http\.sslVerify\s+false'
    message: TLS certificate verification is disabled.
    fix: Remove -k/--insecure; pass your CA with --cacert.

  - id: code.sh.unsafe-eval-or-perms
    type: code
    name: eval on a variable / world-writable permissions
    languages: [shell]
    severity: warning
    cwe: CWE-732
    pattern: '\beval\s+["'']?\$|\bchmod\s+(?:-R\s+)?(?:0?777|a\+rwx)\b'
    message: eval on variable data, or chmod 777.
    fix: Avoid eval; grant the minimum permissions needed (e.g. 750 / 640).

  - id: code.ps.remote-exec
    type: code
    name: Download and execute
    languages: [powershell]
    severity: error
    cwe: CWE-494
    pattern: '\b(?:iex|Invoke-Expression)\b[^\n]*(?:DownloadString|Invoke-WebRequest|Invoke-RestMethod|\biwr\b|\birm\b)|\b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^\n|]*\|\s*(?:iex|Invoke-Expression)\b'
    flags: gi
    message: A script is downloaded and executed with Invoke-Expression.
    fix: Download to a file, verify its hash/signature, then run it.

  - id: code.ps.unsafe-settings
    type: code
    name: Certificate bypass / plaintext secure string
    languages: [powershell]
    severity: warning
    cwe: CWE-295
    pattern: 'ServerCertificateValidationCallback\s*=\s*\{\s*\$true\s*\}|-SkipCertificateCheck\b|ConvertTo-SecureString\s+[^\n]*-AsPlainText'
    flags: gi
    message: Certificate checks are bypassed or a secret is converted from plain text in the script.
    fix: Trust your CA properly and read secrets from a vault / Get-Credential.
