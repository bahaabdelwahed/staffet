# Staffet security rules for JavaScript / TypeScript (original work).
rules:
  - id: staffet.js.code-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() / new Function() is called on a non-constant value.
    metadata:
      category: security
      cwe: CWE-95
      fix: Parse data with JSON.parse, or use an explicit lookup instead of dynamic code.
    pattern-either:
      - patterns:
          - pattern: eval($X)
          - pattern-not: eval("...")
      - patterns:
          - pattern: new Function(..., $X)
          - pattern-not: new Function(..., "...")

  - id: staffet.js.command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: A shell command line is assembled from variables and passed to exec().
    metadata:
      category: security
      cwe: CWE-78
      fix: Use execFile()/spawn() with an argument array and no shell.
    pattern-either:
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: $CP.exec($A + $B, ...)
      - pattern: $CP.execSync($A + $B, ...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync(`...${$X}...`, ...)
      - pattern: exec($A + $B, ...)
      - pattern: execSync($A + $B, ...)

  - id: staffet.js.sql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: A SQL statement is built with string interpolation or concatenation.
    metadata:
      category: security
      cwe: CWE-89
      fix: 'Use placeholders: db.query("SELECT ... WHERE id = ?", [id]).'
    patterns:
      - pattern-either:
          - pattern: $DB.$M(`...${$X}...`, ...)
          - pattern: $DB.$M("..." + $X, ...)
          - pattern: $DB.$M("..." + $X + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(query|execute|raw|run|all|get|prepare|\$queryRawUnsafe|\$executeRawUnsafe)$

  - id: staffet.js.dom-xss
    languages: [javascript, typescript]
    severity: WARNING
    message: HTML is written to the DOM from a non-constant value (XSS risk).
    metadata:
      category: security
      cwe: CWE-79
      fix: Use textContent / createElement, or sanitise with a vetted library first.
    pattern-either:
      - patterns:
          - pattern: $EL.innerHTML = $X
          - pattern-not: $EL.innerHTML = "..."
      - patterns:
          - pattern: $EL.outerHTML = $X
          - pattern-not: $EL.outerHTML = "..."
      - patterns:
          - pattern: document.write($X)
          - pattern-not: document.write("...")
      - patterns:
          - pattern: $EL.insertAdjacentHTML($POS, $X)
          - pattern-not: $EL.insertAdjacentHTML($POS, "...")

  - id: staffet.js.reflected-xss
    languages: [javascript, typescript]
    severity: WARNING
    message: Request data is sent back in an HTML response without escaping.
    metadata:
      category: security
      cwe: CWE-79
      fix: Escape the value, or return JSON / use a templating engine with auto-escaping.
    pattern-either:
      - pattern: $RES.send(`...${$REQ.$A.$B}...`)
      - pattern: $RES.send("..." + $REQ.query.$B)
      - pattern: $RES.send("..." + $REQ.params.$B)
      - pattern: $RES.send("..." + $REQ.body.$B)

  - id: staffet.js.tls-verify-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification is disabled.
    metadata:
      category: security
      cwe: CWE-295
      fix: Remove rejectUnauthorized:false; add your CA with the `ca` option or NODE_EXTRA_CA_CERTS.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: staffet.js.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5/SHA-1 are broken for security purposes.
    metadata:
      category: security
      cwe: CWE-327
      fix: Use sha256 or stronger; use scrypt/bcrypt/argon2 for passwords.
    pattern-either:
      - pattern: $C.createHash("md5")
      - pattern: $C.createHash("sha1")

  - id: staffet.js.insecure-random
    languages: [javascript, typescript]
    severity: WARNING
    message: Math.random() is not cryptographically secure and must not generate secrets.
    metadata:
      category: security
      cwe: CWE-338
      fix: Use crypto.randomBytes() / crypto.randomUUID().
    patterns:
      - pattern-either:
          - pattern: const $VAR = <... Math.random() ...>
          - pattern: let $VAR = <... Math.random() ...>
          - pattern: var $VAR = <... Math.random() ...>
          - pattern: $VAR = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|passw|otp|nonce|salt|session|apikey|api_key).*

  - id: staffet.js.path-traversal
    languages: [javascript, typescript]
    severity: WARNING
    message: A file path comes straight from the HTTP request.
    metadata:
      category: security
      cwe: CWE-22
      fix: Resolve the path and check it stays inside the allowed base directory.
    pattern-either:
      - pattern: fs.$F($REQ.query.$B, ...)
      - pattern: fs.$F($REQ.params.$B, ...)
      - pattern: fs.$F($REQ.body.$B, ...)
      - pattern: fs.$F(path.join($BASE, $REQ.query.$B), ...)
      - pattern: fs.$F(path.join($BASE, $REQ.params.$B), ...)
      - pattern: $RES.sendFile($REQ.query.$B, ...)
      - pattern: $RES.sendFile($REQ.params.$B, ...)
      - pattern: $RES.sendFile(path.join($BASE, $REQ.query.$B), ...)
      - pattern: $RES.sendFile(path.join($BASE, $REQ.params.$B), ...)

  - id: staffet.js.open-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: The redirect target comes straight from the HTTP request.
    metadata:
      category: security
      cwe: CWE-601
      fix: Redirect only to an allow-list of known paths.
    pattern-either:
      - pattern: $RES.redirect($REQ.query.$B)
      - pattern: $RES.redirect($REQ.params.$B)
      - pattern: $RES.redirect($REQ.body.$B)

  - id: staffet.js.hardcoded-jwt-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: A JWT is signed or verified with a hard-coded secret.
    metadata:
      category: security
      cwe: CWE-798
      fix: Load the signing key from the environment or a secret manager.
    pattern-either:
      - pattern: $JWT.sign($P, "...", ...)
      - pattern: $JWT.verify($T, "...", ...)

  - id: staffet.js.jwt-none-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT verification accepts the "none" algorithm.
    metadata:
      category: security
      cwe: CWE-347
      fix: Pass an explicit list of strong algorithms.
    pattern: '$JWT.verify($T, $K, {..., algorithms: [..., "none", ...], ...})'
